
name: Trauso Portable Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build portable executable
        run: npm run tauri -- build --no-bundle --target x86_64-pc-windows-msvc

      - name: Package portable files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $exe = "src-tauri/target/x86_64-pc-windows-msvc/release/trauso.exe"
          $out = "Trauso-Portable"

          if (!(Test-Path $exe)) {
            throw "trauso.exe was not generated."
          }

          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item $exe "$out/trauso.exe"

          # Include aria2 runtime files if the project uses them.
          if (Test-Path "aria2") {
            Copy-Item "aria2" "$out/aria2" -Recurse
          }

          if (Test-Path "aria2.conf") {
            Copy-Item "aria2.conf" "$out/aria2.conf"
          }

          @"
          Trauso Portable
          ===============

          Run trauso.exe to start the application.

          If the application fails to start on another PC,
          install the Microsoft Edge WebView2 Runtime.
          "@ | Set-Content "$out/README-PORTABLE.txt"

          Compress-Archive `
            -Path "$out/*" `
            -DestinationPath "Trauso-Portable-Windows-x64.zip" `
            -Force

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Trauso-Portable-Windows-x64
          path: Trauso-Portable-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
